openapi: 3.1.0
info:
  title: SDAR Benchmark Dashboard Overview API
  version: 0.1.0
paths:
  /v1/dashboard/overview:
    get:
      summary: Load a consistent Overview snapshot
      parameters:
        - in: query
          name: candidateId
          required: true
          schema: { type: string }
        - in: query
          name: baselineId
          required: false
          schema: { type: string }
        - in: query
          name: datasetVersion
          required: true
          schema: { type: string }
        - in: query
          name: runId
          required: false
          schema: { type: string }
        - in: query
          name: track
          required: false
          schema: { type: string, default: all }
        - in: query
          name: riskLevel
          required: false
          schema: { type: string, default: all }
        - in: query
          name: period
          required: false
          schema: { type: string, default: 7d }
      responses:
        '200':
          description: Consistent dashboard snapshot
          content:
            application/json:
              schema:
                type: object
                required: [snapshot, context, releaseGate, kpis]
                properties:
                  snapshot:
                    type: object
                    required: [snapshotId, watermark, projectionLagMs]
                    properties:
                      snapshotId: { type: string }
                      watermark: { type: string, format: date-time }
                      projectionLagMs: { type: integer, minimum: 0 }
                  context: { type: object }
                  releaseGate: { type: object }
                  kpis: { type: object }
                  analysisConclusions: { type: array, items: { type: object } }
                  attentionItems: { type: array, items: { type: object } }
                  qualityTrend: { type: array, items: { type: object } }
                  regressionWaterfall: { type: [object, 'null'] }
                  trackRiskMatrix: { type: array, items: { type: object } }
                  metricHeatmap: { type: array, items: { type: object } }
                  evidenceReadinessFunnel: { type: object }
                  qualityStabilityPoints: { type: array, items: { type: object } }
                  regressionContributors: { type: array, items: { type: object } }
                  scoreDistribution: { type: object }
                  anomalyTimeline: { type: array, items: { type: object } }
                  operationalSummary: { type: array, items: { type: object } }
                  systemStatus: { type: array, items: { type: object } }
                  recentRuns: { type: array, items: { type: object } }
