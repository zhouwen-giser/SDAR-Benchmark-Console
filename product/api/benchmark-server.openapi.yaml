      type: object
      additionalProperties: false
      required:
        - executionTarget
        - nativeRequirement
        - telemetryPolicy
        - observationTimePolicy
        - reconciliationPolicy
        - streamingEnabled
      properties:
        executionTarget:
          type: string
          enum:
            - simulated
            - live_native
        nativeRequirement:
          type: string
          enum:
            - prefer_native
            - require_native
        telemetryPolicy:
          type: string
          enum:
            - require_full
            - allow_partial
            - development_relay
        observationTimePolicy:
          type: string
          enum:
            - require_source_observed_at
            - allow_received_at_fallback
        reconciliationPolicy:
          type: string
          enum:
            - automatic
            - manual
        streamingEnabled:
          type: boolean
    NativeRunSummary:
      type: object
      additionalProperties: false
      required:
        - overall
        - nativeLayerCount
        - substitutionCount
        - unavailableLayerCount
        - identityClosureStatus
        - telemetryStatus
        - formalEligible
        - reasonCodes
      properties:
        overall:
          type: string
          enum:
            - native
            - mixed
            - substituted
            - unavailable
        nativeLayerCount: *a10
        substitutionCount: *a10
        unavailableLayerCount: *a10
        identityClosureStatus:
          type: string
          enum:
            - exact
            - partial
            - unresolved
            - conflict
        telemetryStatus:
          type: string
          enum:
            - ready
            - partial
            - unavailable
            - drift
            - conflict
        formalEligible:
          const: false
        reasonCodes: *a7
    LiveNativeIdentityReference:
      type: object
      additionalProperties: false
      required:
        - kind
        - identity
        - authority
        - sourceRef
      properties:
        kind: *a19
        identity: *a19
        authority: *a19
        sourceRef: *a6
    LiveNativeExecutionPolicy:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - executionTarget
        - nativeRequirement
        - telemetryPolicy
        - observationTimePolicy
        - reconciliationPolicy
        - streamingEnabled
        - formalEligible
      properties:
        schemaVersion:
          const: sdar-benchmark.live-native-execution-policy/v1
        executionTarget:
          const: live_native
        nativeRequirement:
          const: require_native
        telemetryPolicy:
          const: require_full
        observationTimePolicy:
          const: require_source_observed_at
        reconciliationPolicy:
          type: string
          enum:
            - automatic
            - manual
        streamingEnabled:
          type: boolean
        formalEligible:
          const: false
      example:
        schemaVersion: sdar-benchmark.live-native-execution-policy/v1
        executionTarget: live_native
