openapi: 3.1.0
info:
  title: SDAR Benchmark Server API
  version: 0.3.0
  description: Unauthenticated SDAR Benchmark Server Live Native Operations v0.3 API. PostgreSQL is transactional authority, ClickHouse is an allowlisted analytics projection, and ArtifactStore contains immutable bodies. Development responses never imply formal qualification.
security: []
servers:
  - url: http://127.0.0.1:18090
paths:
  /health:
    get:
      operationId: getHealth
      summary: Process liveness
      responses:
        "200":
          description: Process is alive even when dependencies are not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
      x-query-source: process
      x-capability-id: CAP-001
      x-console-status: EXISTING
      x-consistency: live
      x-availability-policy: typed-authoritative
  /ready:
    get:
      operationId: getReadiness
      summary: Dependency and contract readiness
      responses:
        "200":
          description: PostgreSQL, ClickHouse, contracts, and schemas are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ready"
        "503":
          description: Process is alive but one or more readiness checks failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ready"
      x-query-source: mixed
      x-capability-id: CAP-002
      x-console-status: EXISTING
      x-consistency: probe-time
      x-availability-policy: typed-authoritative
  /v1/operational-evaluations:
    post:
      operationId: createOperationalEvaluation
      summary: Idempotently queue an operational evaluation
      x-command-source: postgres
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOperationalEvaluation"
      responses:
        "202":
          description: Evaluation job was created or already existed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationJobStatus"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
      x-capability-id: CAP-022
      x-console-status: EXISTING
      x-consistency: transactional/current
      x-availability-policy: typed-authoritative
  /v1/evaluations/{evaluationId}:
    get:
      operationId: getEvaluation
      summary: Get a projected evaluation with authority and projection status
      x-query-source: mixed
      parameters:
        - $ref: "#/components/parameters/EvaluationId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Typed evaluation summary and section links
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationSummaryQueryEnvelope"
      x-capability-id: CAP-054
      x-console-status: EXTEND
      x-consistency: watermarked
      x-availability-policy: typed-authoritative
  /v1/episodes/{episodeId}/evaluations:
    get:
      operationId: listEpisodeEvaluations
      summary: List projected evaluations for an episode
      x-query-source: clickhouse
      parameters:
        - name: episodeId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: profileId
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
        - name: profileVersion
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
        - name: origin
          in: query
          required: false
          schema:
            type: string
            enum:
              - operational
              - benchmark
              - replay
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Evaluation history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationSummaryListQueryEnvelope"
      x-capability-id: CAP-063
      x-console-status: EXTEND
      x-consistency: watermarked
      x-availability-policy: typed-authoritative
  /v1/episodes/{episodeId}/evaluations/latest:
    get:
      operationId: getLatestEpisodeEvaluation
      summary: Get the latest projected evaluation for an episode
      x-query-source: clickhouse
      parameters:
        - name: episodeId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: profileId
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
        - name: profileVersion
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
        - name: origin
          in: query
          required: false
          schema:
            type: string
            enum:
              - operational
              - benchmark
              - replay
      responses:
        "200":
          description: Latest evaluation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationSummaryQueryEnvelope"
      x-capability-id: CAP-064
      x-console-status: EXTEND
      x-consistency: watermarked
      x-availability-policy: typed-authoritative
  /v1/episodes/{episodeId}/readiness:
    get:
      operationId: getEpisodeReadiness
      summary: Get latest source Evidence readiness for an episode
      x-query-source: clickhouse
      parameters:
        - $ref: "#/components/parameters/EpisodeId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Source Evidence readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodeReadinessQueryEnvelope"
      x-capability-id: CAP-065
      x-console-status: EXTEND
      x-consistency: watermarked
      x-availability-policy: typed-authoritative
  /v1/benchmark-run-preflights:
    post:
      operationId: preflightBenchmarkRun
      summary: Resolve a side-effect-free UGV Development execution plan
      x-command-source: postgres
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBenchmarkRun"
      responses:
        "200":
          description: Ready, ready with explicit substitutions, or a local failed preflight.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevelopmentRunPreflight"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
      x-capability-id: CAP-114
      x-console-status: NEW
      x-consistency: read-only/current
      x-availability-policy: typed-authoritative
  /v1/benchmark-run-presets/ugv-diagnostic-development:
    get:
      operationId: getUgvDiagnosticDevelopmentPreset
      summary: Discover the Server-configured four-case UGV Development request
      x-query-source: derived
      responses:
        "200":
          description: Available request template or explicit configuration gap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevelopmentRunPreset"
      x-capability-id: CAP-115
      x-console-status: NEW
      x-consistency: process/current
      x-availability-policy: typed-authoritative
  /v1/benchmark-runs:
    post:
      operationId: createBenchmarkRun
      summary: Create a Benchmark run from exact immutable references
      x-command-source: postgres
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBenchmarkRun"
      responses:
        "202":
          description: Run was created or idempotently reused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkRunStatus"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
      x-capability-id: CAP-023
      x-console-status: EXISTING
      x-consistency: transactional/current
      x-availability-policy: typed-authoritative
    get:
      operationId: getBenchmarkRuns
      tags:
        - Benchmark runs
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: candidateSnapshotId
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: datasetVersionRef
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: List runs with Candidate, Dataset, Profile, counts, status and timestamps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkRunListEnvelope"
      summary: List runs with Candidate, Dataset, Profile, counts, status and timestamps
      x-query-source: mixed
      x-capability-id: CAP-024
      x-console-status: NEW
      x-consistency: mixed explicit
      x-availability-policy: typed-authoritative
  /v1/benchmark-runs/{runId}:
    get:
      operationId: getBenchmarkRunAuthorityStatus
      summary: Get authoritative Benchmark run status
      x-command-source: postgres
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Authoritative run state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkRunStatus"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
      x-query-source: postgres
      x-capability-id: CAP-025
      x-console-status: EXISTING
      x-consistency: transactional/current
      x-availability-policy: typed-authoritative
  /v1/benchmark-runs/{runId}/qualification:
    get:
      operationId: getDiagnosticRunQualification
      summary: Get diagnostic-only run qualification authority
      x-query-source: postgres
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Diagnostic qualification with null score and unavailable release gate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticQualificationEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
      x-consistency: immutable relation / exact subject / explicit availability
      x-availability-policy: typed-authoritative
      x-capability-id: CAP-107
      x-console-status: NEW
  /v1/benchmark-runs/{runId}/external-capabilities:
    get:
      operationId: listDiagnosticExternalCapabilities
      summary: List immutable external capability probe Artifacts
      x-query-source: postgres
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Bounded external capability Artifact page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticArtifactListEnvelope"
      x-consistency: immutable relation / exact subject / explicit availability
      x-availability-policy: typed-authoritative
      x-capability-id: CAP-108
      x-console-status: NEW
  /v1/benchmark-runs/{runId}/repetitions/{repetitionId}:
    get:
      operationId: getDiagnosticRepetition
      summary: Get a diagnostic repetition authority projection
      x-query-source: postgres
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/RepetitionId"
      responses:
        "200":
          description: Repetition authority without raw private detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticRepetitionEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
      x-consistency: immutable relation / exact subject / explicit availability
      x-availability-policy: typed-authoritative
      x-capability-id: CAP-109
      x-console-status: NEW
  /v1/benchmark-runs/{runId}/repetitions/{repetitionId}/artifacts:
    get:
      operationId: listDiagnosticRepetitionArtifacts
      summary: List immutable typed Artifacts for a diagnostic repetition
      x-query-source: postgres
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/RepetitionId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Bounded repetition Artifact page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticArtifactListEnvelope"
      x-consistency: immutable relation / exact subject / explicit availability
      x-availability-policy: typed-authoritative
      x-capability-id: CAP-110
      x-console-status: NEW
  /v1/benchmark-runs/{runId}/repetitions/{repetitionId}/execution-trace:
    get:
      operationId: getDiagnosticExecutionTrace
      summary: Get the latest immutable execution-trace Artifact
      x-query-source: postgres
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/RepetitionId"
      responses:
        "200":
          description: Exact execution trace Artifact relation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticArtifactEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
      x-consistency: immutable relation / exact subject / explicit availability
      x-availability-policy: typed-authoritative
      x-capability-id: CAP-111
      x-console-status: NEW
  /v1/benchmark-runs/{runId}/repetitions/{repetitionId}/physical-verification:
    get:
      operationId: getDiagnosticPhysicalVerification
      summary: Get independent physical-verification Artifact
      x-query-source: postgres
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/RepetitionId"
      responses:
        "200":
          description: Physical verification Artifact relation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticArtifactEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
      x-consistency: immutable relation / exact subject / explicit availability
      x-availability-policy: typed-authoritative
      x-capability-id: CAP-112
      x-console-status: NEW
  /v1/benchmark-runs/{runId}/repetitions/{repetitionId}/fault-attribution:
    get:
      operationId: getDiagnosticFaultAttribution
      summary: Get deterministic fault-attribution Artifact
      x-query-source: postgres
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/RepetitionId"
      responses:
        "200":
          description: Fault attribution Artifact relation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticArtifactEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
      x-consistency: immutable relation / exact subject / explicit availability
      x-availability-policy: typed-authoritative
      x-capability-id: CAP-113
      x-console-status: NEW
  /v1/benchmark-runs/{runId}/cancel:
    post:
      operationId: cancelBenchmarkRun
      summary: Idempotently request cancellation of a non-terminal Benchmark run
      x-command-source: postgres
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 4096
      responses:
        "202":
          description: Cancellation is durably requested; inspect cancellationRequested and status because a leased Run remains active until its worker confirms Candidate cancellation and cleanup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkRunStatus"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
      x-capability-id: CAP-026
      x-console-status: EXISTING
      x-consistency: transactional/current
      x-availability-policy: typed-authoritative
  /v1/baselines:
    post:
      operationId: promoteBaseline
      summary: Promote a completed comparable formal run to Baseline
      x-command-source: postgres
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoteBaseline"
      responses:
        "201":
          description: Baseline was promoted or idempotently reused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaselineStatus"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
      x-capability-id: CAP-036
      x-console-status: EXISTING
      x-consistency: transactional/current
      x-availability-policy: typed-authoritative
    get:
      operationId: getBaselines
      tags:
        - Baselines
      parameters: []
      responses:
        "200":
          description: List baseline versions with linked run/candidate/dataset/profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaselineListEnvelope"
      summary: List baseline versions with linked run/candidate/dataset/profile
      x-query-source: mixed
      x-capability-id: CAP-037
      x-console-status: NEW
      x-consistency: mixed explicit
      x-availability-policy: typed-authoritative
  /v1/comparisons:
    post:
      operationId: createComparison
      summary: Compare a candidate run with an immutable Baseline
      x-command-source: postgres
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateComparison"
      responses:
        "200":
          description: An identical terminal comparison authority was idempotently reused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonStatus"
        "201":
          description: Comparison was synchronously materialized to a terminal PostgreSQL authority state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonStatus"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
      x-capability-id: CAP-039
      x-console-status: EXISTING
      x-consistency: transactional/current
      x-availability-policy: typed-authoritative
    get:
      operationId: getComparisons
      tags:
        - Comparisons
      parameters:
        - name: baselineId
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: candidateRunId
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: status
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: List comparisons and status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonListEnvelope"
      summary: List comparisons and status
      x-query-source: mixed
      x-capability-id: CAP-040
      x-console-status: NEW
      x-consistency: mixed explicit
      x-availability-policy: typed-authoritative
  /v1/benchmark-runs/{runId}/results:
    get:
      operationId: listBenchmarkRunResults
      summary: List projected case aggregates for a run
      x-query-source: clickhouse
      parameters: &a1
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paged case aggregates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkCaseAggregateListQueryEnvelope"
      x-capability-id: CAP-028
      x-console-status: EXTEND
      x-consistency: watermarked
      x-availability-policy: typed-authoritative
  /v1/benchmark-runs/{runId}/cases:
    get:
      operationId: listBenchmarkRunCases
      summary: List projected case executions for a run
      x-query-source: clickhouse
      parameters: *a1
      responses:
        "200":
          description: Paged case executions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectedCaseExecutionListQueryEnvelope"
      x-capability-id: CAP-029
      x-console-status: EXTEND
      x-consistency: watermarked
      x-availability-policy: typed-authoritative
  /v1/benchmark-runs/{runId}/failures:
    get:
      operationId: listBenchmarkRunFailures
      summary: List projected failed, invalid, and not-ready cases
      x-query-source: clickhouse
      parameters: *a1
      responses:
        "200":
          description: Paged failed/invalid/NR cases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectedCaseExecutionListQueryEnvelope"
      x-capability-id: CAP-030
      x-console-status: EXTEND
      x-consistency: watermarked
      x-availability-policy: typed-authoritative
  /v1/benchmark-runs/{runId}/release-gate:
    get:
      operationId: getBenchmarkRunReleaseGate
      summary: Get formal v1.5 release-gate projection
      x-query-source: clickhouse
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Release decision and blockers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkReleaseGateQueryEnvelope"
      x-capability-id: CAP-031
      x-console-status: EXTEND
      x-consistency: watermarked
      x-availability-policy: typed-authoritative
  /v1/benchmark-cases/{caseId}/history:
    get:
      operationId: listBenchmarkCaseHistory
      summary: List projected result history for a Benchmark Case
      x-query-source: clickhouse
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Projected historical result aggregates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkCaseAggregateListQueryEnvelope"
      x-capability-id: CAP-047
      x-console-status: EXTEND
      x-consistency: watermarked
      x-availability-policy: typed-authoritative
  /v1/comparisons/{comparisonId}:
    get:
      operationId: getComparison
      summary: Get a projected comparison summary
      x-query-source: clickhouse
      parameters:
        - $ref: "#/components/parameters/ComparisonId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Comparison summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonProjectionQueryEnvelope"
      x-capability-id: CAP-041
      x-console-status: EXTEND
      x-consistency: watermarked
      x-availability-policy: typed-authoritative
  /v1/comparisons/{comparisonId}/cases:
    get:
      operationId: listComparisonCases
      summary: List projected per-case comparison results
      x-query-source: clickhouse
      parameters:
        - $ref: "#/components/parameters/ComparisonId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paged paired case changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonCaseProjectionListQueryEnvelope"
      x-capability-id: CAP-042
      x-console-status: EXTEND
      x-consistency: watermarked
      x-availability-policy: typed-authoritative
  /v1/analytics/candidates:
    get:
      operationId: listCandidateAnalytics
      summary: List candidate summary analytics
      x-query-source: clickhouse
      parameters:
        - name: runId
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: candidateSnapshotId
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: datasetVersion
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: profileVersionId
          in: query
          required: false
          schema:
