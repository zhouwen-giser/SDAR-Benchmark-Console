components:
  parameters:
    EvaluationId:
      name: evaluationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    EpisodeId:
      name: episodeId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    RunId:
      name: runId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    RepetitionId:
      name: repetitionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    ComparisonId:
      name: comparisonId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    TenantId:
      name: tenantId
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/OpaqueId"
    ProjectId:
      name: projectId
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/OpaqueId"
    RunFilter:
      name: runId
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/OpaqueId"
    Limit:
      name: limit
      in: query
      required: false
      description: Bounded row count. Default 50; hard maximum 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque operation-bound cursor; reuse with another operation is rejected.
      schema:
        type: string
        minLength: 1
        maxLength: 4096
  responses:
    QueryResult:
      description: Projected query result with cursor and projection metadata.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/QueryEnvelope"
    InvalidRequest:
      description: Request shape, filter, cursor, or row limit is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Requested authority or projection was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Command conflicts with immutable state or a state machine.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: Backend, schema, projection, or contract is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    OpaqueId:
      type: string
      minLength: 1
      maxLength: 256
      pattern: ^[^\x00-\x1F\x7F]+$
    ContentHash:
      type: string
      pattern: ^sha256:[0-9a-f]{64}$
    Health:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - generatedAt
      properties:
        status:
          const: ok
        service:
          const: sdar-benchmark-server
        generatedAt:
          type: string
          format: date-time
    Ready:
      type: object
      additionalProperties: false
      required:
        - ready
        - checks
        - generatedAt
      properties:
        ready:
          type: boolean
        checks:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            required:
              - ready
            properties:
              ready:
                type: boolean
              details:
                type: object
                additionalProperties: true
        generatedAt:
          type: string
          format: date-time
    QueryEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
        - page
        - watermark
        - projectionLagMs
        - contracts
        - generatedAt
      properties:
        data:
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              maxItems: 200
              items:
                type: object
                additionalProperties: true
        page:
          type: object
          additionalProperties: false
          required:
            - nextCursor
          properties:
            nextCursor:
              type:
                - string
                - "null"
              maxLength: 4096
        watermark:
          type:
            - string
            - "null"
          format: date-time
        projectionLagMs:
          type:
            - integer
            - "null"
          minimum: 0
        contracts:
          type: array
          prefixItems:
            - const: sdar.evidence/v1
            - const: sdar-benchmark/0.1
          minItems: 2
          maxItems: 2
        generatedAt:
          type: string
          format: date-time
    Error:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - retryable
          properties:
            code:
              type: string
              enum:
                - INVALID_REQUEST
                - NOT_FOUND
                - CONFLICT
                - CONTRACT_DRIFT
                - BACKEND_UNAVAILABLE
                - BENCHMARK_STATE_INVALID
                - EVALUATION_NOT_READY
                - PROJECTION_LAGGING
            message:
              type: string
              minLength: 1
            details:
              type: object
              additionalProperties: true
            retryable:
              type: boolean
    CreateOperationalEvaluation:
      type: object
      additionalProperties: false
      required:
        - episodeId
        - evaluationProfileVersionId
      properties:
        episodeId:
          $ref: "#/components/schemas/OpaqueId"
        evaluationProfileVersionId:
          $ref: "#/components/schemas/OpaqueId"
        idempotencyKey:
          $ref: "#/components/schemas/OpaqueId"
    EvaluationJobStatus:
      type: object
      additionalProperties: false
      required:
        - jobId
        - state
        - created
        - authorityStatus
        - projectionStatus
      properties:
        jobId:
          $ref: "#/components/schemas/OpaqueId"
        state:
          type: string
        created:
          type: boolean
        formalEligible:
          const: false
        qualificationStatus:
          const: not_requested
        qualityScore:
          type: "null"
        releaseGate:
          const: unavailable
        substitutionCount:
          type: integer
          minimum: 0
        authorityStatus:
          type: string
        projectionStatus:
          const: pending
    CreateBenchmarkRun:
      type: object
      additionalProperties: false
      required:
        - datasetVersionRef
        - candidate
        - environment
        - executionPolicy
      properties:
        datasetVersionRef:
          $ref: "#/components/schemas/OpaqueId"
        candidate:
          type: object
          additionalProperties: false
          required:
            - snapshotRef
            - specification
          properties:
            snapshotRef:
              $ref: "#/components/schemas/OpaqueId"
            specification:
              type: object
              additionalProperties: false
              required:
                - baseUrl
              properties:
                baseUrl:
                  type: string
                  format: uri
                  pattern: ^https?://
                  maxLength: 2048
                tenant:
                  $ref: "#/components/schemas/OpaqueId"
        environment:
          type: object
          additionalProperties: false
          required:
            - adapter
          properties:
            adapter:
              type: string
              enum:
                - fixture
                - replay
                - external_integration
            ref:
              $ref: "#/components/schemas/OpaqueId"
            config:
              type: object
              additionalProperties: true
        executionPolicy:
          oneOf:
            - $ref: "#/components/schemas/LiveNativeExecutionPolicy"
            - $ref: "#/components/schemas/LiveNativeExecutionPolicy"
            - $ref: "#/components/schemas/DevelopmentExecutionPolicy"
            - type: object
              additionalProperties: true
        contractReleaseRef:
          $ref: "#/components/schemas/OpaqueId"
        idempotencyKey:
          $ref: "#/components/schemas/OpaqueId"
        nativeRequirement:
          type: string
          enum:
            - prefer_native
            - require_native
        telemetryPolicy:
          type: string
          enum:
            - require_full
            - allow_partial
            - development_relay
        observationTimePolicy:
          type: string
          enum:
            - require_source_observed_at
            - allow_received_at_fallback
        reconciliationPolicy:
          type: string
          enum:
            - automatic
            - manual
        streamingEnabled:
          type: boolean
    BenchmarkRunStatus:
      type: object
      additionalProperties: false
      required:
        - runId
        - status
        - cancellationRequested
        - datasetVersionRef
        - candidateSnapshotId
        - contractReleaseId
        - totalCaseCount
        - completedCaseCount
        - passedCaseCount
        - failedCaseCount
        - notReadyCaseCount
        - failureClass
        - failureCode
        - createdAt
        - startedAt
        - completedAt
        - updatedAt
      properties:
        runId:
          $ref: "#/components/schemas/OpaqueId"
        status:
          type: string
        cancellationRequested:
          type: boolean
        datasetVersionRef:
          $ref: "#/components/schemas/OpaqueId"
        candidateSnapshotId:
          $ref: "#/components/schemas/OpaqueId"
        contractReleaseId:
          $ref: "#/components/schemas/OpaqueId"
        totalCaseCount:
          type: integer
          minimum: 0
        completedCaseCount:
          type: integer
          minimum: 0
        passedCaseCount:
          type: integer
          minimum: 0
        failedCaseCount:
          type: integer
          minimum: 0
        notReadyCaseCount:
          type: integer
          minimum: 0
        failureClass:
          type:
            - string
            - "null"
        failureCode:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        startedAt:
          type:
            - string
            - "null"
          format: date-time
        completedAt:
          type:
            - string
            - "null"
          format: date-time
        updatedAt:
          type: string
          format: date-time
        created:
          type: boolean
    DevelopmentExecutionPermit:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - enabled
        - environmentRef
        - target
        - maxConcurrentRuns
        - allowedFaultProfiles
        - expiresAt
      properties:
        schemaVersion:
          const: sdar-benchmark.development-execution-permit/v1
        enabled:
          type: boolean
        environmentRef:
          type: string
          minLength: 1
        target:
          enum:
            - simulated
            - live
        maxConcurrentRuns:
          type: integer
          minimum: 1
        maxNavigateCommandsPerRun:
          type: integer
          minimum: 0
        allowedFaultProfiles:
          type: array
          uniqueItems: true
          items:
            type: string
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
        notes:
          type:
            - string
            - "null"
    DevelopmentExecutionPolicy:
      type: object
      additionalProperties: true
      required:
        - runClass
        - target
        - executionProfile
        - allowDevelopmentSubstitutions
        - fallbackToSimulation
        - permit
      properties:
        runClass:
          const: development
        target:
          enum:
            - simulated
            - live
        executionProfile:
          const: ugv-diagnostic-development/0.1
        allowDevelopmentSubstitutions:
          type: boolean
        fallbackToSimulation:
          type: boolean
        permit:
          $ref: "#/components/schemas/DevelopmentExecutionPermit"
        developmentPreflight:
          $ref: "#/components/schemas/DevelopmentRunPreflight"
        provenance:
          type: object
          additionalProperties: true
    DevelopmentSubstitution:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - substitutionId
        - capabilityId
        - implementationKind
        - implementationId
        - reasonCode
        - sourceCapabilityStatus
        - artifactRef
        - activatedAt
        - formalEligible
      properties:
        schemaVersion:
          const: sdar-benchmark.development-substitution/v1
        substitutionId:
          type: string
        capabilityId:
          type: string
        implementationKind:
          enum:
            - native
            - proxy
            - deterministic_substitute
        implementationId:
          type: string
        reasonCode:
          type: string
        sourceCapabilityStatus:
          enum:
            - available
            - unavailable
            - unknown
            - not_required
        artifactRef:
          type:
            - string
            - "null"
        activatedAt:
          type: string
          format: date-time
        formalEligible:
          const: false
    DevelopmentPreflightCheck:
      type: object
      additionalProperties: false
      required:
        - checkId
        - status
        - reasonCodes
      properties:
        checkId:
          type: string
        status:
          enum:
            - pass
            - warning
            - fail
        reasonCodes:
          type: array
          items:
            type: string
        details:
          type: object
          additionalProperties: true
    DevelopmentRunPreflight:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - preflightId
        - status
        - canCreateRun
        - canExecuteRun
        - formalEligible
        - checks
        - substitutions
        - warnings
        - generatedAt
      properties:
        schemaVersion:
          const: sdar-benchmark.development-run-preflight/v1
        preflightId:
          type: string
        status:
          enum:
            - ready
            - ready_with_substitutions
            - failed_preflight
        canCreateRun:
          type: boolean
        canExecuteRun:
          type: boolean
        formalEligible:
          const: false
        checks:
          type: array
          items:
            $ref: "#/components/schemas/DevelopmentPreflightCheck"
        substitutions:
          type: array
          items:
            $ref: "#/components/schemas/DevelopmentSubstitution"
        warnings:
          type: array
          items:
            type: string
        generatedAt:
          type: string
          format: date-time
        nativeRequirement: &a6
          type:
            - string
            - "null"
        selectedEnvironment:
          oneOf:
            - $ref: "#/components/schemas/EnvironmentDetail"
            - type: "null"
        selectedResources:
          type: array
          items:
            $ref: "#/components/schemas/ResourceDetail"
        nativeLayerStatus:
          type: array
          items:
            $ref: "#/components/schemas/NativeCoverageLayer"
    DevelopmentRunPreset:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - presetId
        - label
        - availability
        - reasonCodes
        - requestTemplate
        - generatedAt
      properties:
        schemaVersion:
          const: sdar-benchmark.development-run-preset/v1
        presetId:
          const: ugv-four-case-development/0.1
        label:
          type: string
        availability:
          enum:
            - available
            - unavailable
        reasonCodes:
          type: array
          items:
            type: string
        requestTemplate:
          oneOf:
            - $ref: "#/components/schemas/CreateBenchmarkRun"
            - type: "null"
        generatedAt:
          type: string
          format: date-time
    PromoteBaseline:
      type: object
      additionalProperties: false
      required:
        - runId
        - promotedBy
        - promotionReason
      properties:
        runId:
          $ref: "#/components/schemas/OpaqueId"
        promotedBy:
          type: string
          minLength: 1
          maxLength: 256
        promotionReason:
          type: string
          minLength: 1
          maxLength: 4096
        idempotencyKey:
          $ref: "#/components/schemas/OpaqueId"
    BaselineStatus:
      type: object
      additionalProperties: false
      required:
        - baselineId
        - runId
        - status
        - created
      properties:
        baselineId:
          $ref: "#/components/schemas/OpaqueId"
        runId:
          $ref: "#/components/schemas/OpaqueId"
        status:
          const: promoted
        created:
          type: boolean
    CreateComparison:
      type: object
      additionalProperties: false
      required:
        - baselineId
        - candidateRunId
      properties:
        baselineId:
          $ref: "#/components/schemas/OpaqueId"
        candidateRunId:
          $ref: "#/components/schemas/OpaqueId"
        idempotencyKey:
          $ref: "#/components/schemas/OpaqueId"
    ComparisonStatus:
      type: object
      additionalProperties: false
      required:
        - comparisonId
        - baselineId
        - candidateRunId
        - status
        - created
        - isComparable
        - reasonCodes
        - materializedCaseCount
        - summaryHash
        - releaseDecision
        - projectionStatus
      properties:
        comparisonId:
          $ref: "#/components/schemas/OpaqueId"
        baselineId:
          $ref: "#/components/schemas/OpaqueId"
        candidateRunId:
          $ref: "#/components/schemas/OpaqueId"
        status:
          type: string
          enum:
            - completed
            - non_comparable
        created:
          type: boolean
        isComparable:
          type: boolean
        reasonCodes:
          type: array
          items:
            type: string
            minLength: 1
          uniqueItems: true
        materializedCaseCount:
          type: integer
          minimum: 0
        summaryHash:
          $ref: "#/components/schemas/ContentHash"
        releaseDecision:
          type: object
          additionalProperties: false
          required:
            - passed
            - blockers
            - hardBlockReasonCodes
          properties:
            passed:
              type: boolean
            blockers:
              type: array
              items:
                type: string
                minLength: 1
              uniqueItems: true
            hardBlockReasonCodes:
              type: array
              items:
                type: string
                minLength: 1
              uniqueItems: true
        projectionStatus:
          const: pending
    ConsoleAvailability:
      type: object
      additionalProperties: false
      required:
        - status
        - reasonCodes
        - unavailableFields
      properties:
        status:
          type: string
          enum:
            - available
            - partial
            - unavailable
        reasonCodes:
          type: array
          items:
            type: string
        unavailableFields:
          type: array
          items:
            type: string
    ConsoleCapabilityEnvelope:
      type: object
      additionalProperties: false
      required:
        - operationId
        - data
        - availability
        - warnings
        - contracts
        - generatedAt
      properties:
        operationId:
          type: string
        data:
          oneOf:
            - type: array
              maxItems: 200
              items:
                type: object
            - type: object
            - type: "null"
        availability:
          $ref: "#/components/schemas/ConsoleAvailability"
        warnings:
          type: array
          items:
            type: string
        page:
          type: object
          additionalProperties: false
          properties:
            nextCursor:
              type:
                - string
                - "null"
        watermark:
          type:
            - string
            - "null"
          format: date-time
        projectionLagMs:
          type:
            - integer
            - "null"
          minimum: 0
        contracts:
          type: array
          items:
            type: string
        generatedAt:
          type: string
          format: date-time
    DashboardSnapshotMeta:
      type: object
      additionalProperties: false
      required:
        - snapshotId
        - watermark
        - projectionLagMs
        - dataStatus
        - moduleErrors
      properties:
        snapshotId:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        watermark:
          type:
            - string
            - "null"
          format: date-time
        projectionLagMs:
          type:
            - integer
            - "null"
          minimum: 0
        dataStatus:
          type: string
          enum:
            - complete
            - partial
            - stale
            - empty
        moduleErrors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - module
              - code
              - message
            properties:
              module:
                type: string
              code:
                type: string
              message:
                type: string
    DashboardOverviewResponse:
      type: object
      additionalProperties: false
      required:
        - snapshot
        - context
        - releaseGate
        - kpis
        - analysisConclusions
        - attentionItems
        - qualityTrend
        - regressionWaterfall
        - trackRiskMatrix
        - metricHeatmap
        - evidenceReadinessFunnel
        - sourceAwareEvidenceFunnel
        - qualityStabilityPoints
        - regressionContributors
        - scoreDistribution
        - anomalyTimeline
        - operationalSummary
        - systemStatus
        - telemetryTrust
        - recentRuns
        - contracts
        - generatedAt
      properties:
        snapshot:
          $ref: "#/components/schemas/DashboardSnapshotMeta"
        context:
          $ref: "#/components/schemas/DashboardContext"
        releaseGate:
          oneOf:
            - $ref: "#/components/schemas/DashboardReleaseGate"
            - type: "null"
        kpis:
          oneOf:
            - $ref: "#/components/schemas/DashboardKpis"
            - type: "null"
        analysisConclusions:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisConclusion"
        attentionItems:
          type: array
          items:
            $ref: "#/components/schemas/AttentionItem"
        qualityTrend:
          type: array
          items:
            $ref: "#/components/schemas/DashboardQualityTrendPoint"
        regressionWaterfall:
          oneOf:
            - $ref: "#/components/schemas/ComparisonProjection"
            - type: "null"
        trackRiskMatrix:
          type: array
          items:
            $ref: "#/components/schemas/DashboardTrackRiskCell"
        metricHeatmap:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsMetric"
        evidenceReadinessFunnel:
          oneOf:
            - $ref: "#/components/schemas/AnalyticsReadinessFunnel"
            - type: "null"
        sourceAwareEvidenceFunnel:
          type: object
        qualityStabilityPoints:
          type: array
          items:
