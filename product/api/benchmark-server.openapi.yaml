components:
  parameters:
    EvaluationId:
      name: evaluationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    EpisodeId:
      name: episodeId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    RunId:
      name: runId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    RepetitionId:
      name: repetitionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    ComparisonId:
      name: comparisonId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    TenantId:
      name: tenantId
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/OpaqueId"
    ProjectId:
      name: projectId
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/OpaqueId"
    RunFilter:
      name: runId
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/OpaqueId"
    Limit:
      name: limit
      in: query
      required: false
      description: Bounded row count. Default 50; hard maximum 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque operation-bound cursor; reuse with another operation is rejected.
      schema:
        type: string
        minLength: 1
        maxLength: 4096
  responses:
    QueryResult:
      description: Projected query result with cursor and projection metadata.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/QueryEnvelope"
    InvalidRequest:
      description: Request shape, filter, cursor, or row limit is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Requested authority or projection was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Command conflicts with immutable state or a state machine.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: Backend, schema, projection, or contract is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    OpaqueId:
      type: string
      minLength: 1
      maxLength: 256
      pattern: ^[^\x00-\x1F\x7F]+$
    ContentHash:
      type: string
      pattern: ^sha256:[0-9a-f]{64}$
    Health:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - generatedAt
      properties:
        status:
          const: ok
        service:
          const: sdar-benchmark-server
        generatedAt:
          type: string
          format: date-time
    Ready:
      type: object
      additionalProperties: false
      required:
        - ready
        - checks
        - generatedAt
      properties:
        ready:
          type: boolean
        checks:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            required:
              - ready
            properties:
              ready:
                type: boolean
              details:
                type: object
                additionalProperties: true
        generatedAt:
          type: string
          format: date-time
    QueryEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
        - page
        - watermark
        - projectionLagMs
        - contracts
        - generatedAt
      properties:
        data:
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              maxItems: 200
              items:
                type: object
                additionalProperties: true
        page:
          type: object
          additionalProperties: false
          required:
            - nextCursor
          properties:
            nextCursor:
              type:
                - string
                - "null"
              maxLength: 4096
        watermark:
          type:
            - string
            - "null"
          format: date-time
        projectionLagMs:
          type:
            - integer
            - "null"
          minimum: 0
        contracts:
          type: array
          prefixItems:
            - const: sdar.evidence/v1
            - const: sdar-benchmark/0.1
          minItems: 2
          maxItems: 2
        generatedAt:
          type: string
          format: date-time
    Error:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - retryable
          properties:
            code:
              type: string
              enum:
                - INVALID_REQUEST
                - NOT_FOUND
                - CONFLICT
                - CONTRACT_DRIFT
                - BACKEND_UNAVAILABLE
                - BENCHMARK_STATE_INVALID
                - EVALUATION_NOT_READY
                - PROJECTION_LAGGING
            message:
              type: string
              minLength: 1
            details:
              type: object
              additionalProperties: true
            retryable:
              type: boolean
    CreateOperationalEvaluation:
      type: object
      additionalProperties: false
      required:
        - episodeId
        - evaluationProfileVersionId
      properties:
        episodeId:
          $ref: "#/components/schemas/OpaqueId"
        evaluationProfileVersionId:
          $ref: "#/components/schemas/OpaqueId"
        idempotencyKey:
          $ref: "#/components/schemas/OpaqueId"
    EvaluationJobStatus:
      type: object
      additionalProperties: false
      required:
        - jobId
        - state
        - created
        - authorityStatus
        - projectionStatus
      properties:
        jobId:
          $ref: "#/components/schemas/OpaqueId"
        state:
          type: string
        created:
          type: boolean
        formalEligible:
          const: false
        qualificationStatus:
          const: not_requested
        qualityScore:
          type: "null"
        releaseGate:
          const: unavailable
        substitutionCount:
          type: integer
          minimum: 0
        authorityStatus:
          type: string
        projectionStatus:
          const: pending
    CreateBenchmarkRun:
      type: object
      additionalProperties: false
      required:
        - datasetVersionRef
        - candidate
        - environment
        - executionPolicy
      properties:
        datasetVersionRef:
          $ref: "#/components/schemas/OpaqueId"
        candidate:
          type: object
          additionalProperties: false
          required:
            - snapshotRef
            - specification
          properties:
            snapshotRef:
              $ref: "#/components/schemas/OpaqueId"
            specification:
              type: object
              additionalProperties: false
              required:
                - baseUrl
              properties:
                baseUrl:
                  type: string
                  format: uri
                  pattern: ^https?://
                  maxLength: 2048
                tenant:
